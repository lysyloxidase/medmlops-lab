name: Nightly delayed-label performance monitoring

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  monitor-performance:
    runs-on: ubuntu-latest
    env:
      MEDMLOPS_AUDIT_DATABASE_URL: ${{ secrets.MEDMLOPS_AUDIT_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync --frozen
      - run: uv run medmlops monitor-performance
      - uses: actions/upload-artifact@v7
        with:
          name: delayed-label-performance-report
          path: reports/performance_monitoring.json
