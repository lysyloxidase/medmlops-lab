[project]
name = "medmlops-lab"
version = "0.1.0"
description = "CPU-only, reproducible clinical risk-prediction MLOps platform."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "MedMLOps-Lab contributors" }]
dependencies = [
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "joblib>=1.4.2",
    "mapie>=0.9.0,<1.0.0",
    "matplotlib>=3.8.4",
    "hydra-core>=1.3.2",
    "mlflow>=2.14.0",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "pandera>=0.21.0",
    "pyarrow>=15.0.2",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "psycopg[binary]>=3.2.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.1",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.1",
    "sqlalchemy>=2.0.30",
    "structlog>=24.1.0",
    "torch>=2.3.0",
    "typer>=0.12.3",
    "ucimlrepo>=0.0.7",
    "xgboost>=2.0.3",
]

[dependency-groups]
dev = [
    "dvc[s3]>=3.50.0",
    "nbstripout>=0.7.1",
    "pre-commit>=3.7.1",
    "pyright>=1.1.360",
    "pytest>=8.2.1",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.24",
]

[project.scripts]
medmlops = "medmlops.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medmlops"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["N815"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/medmlops"]
omit = [
    "src/medmlops/cli.py",
    "src/medmlops/config.py",
    "src/medmlops/data/ingest.py",
    "src/medmlops/data/nhanes_adapter.py",
    "src/medmlops/logging.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportPrivateImportUsage = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUntypedBaseClass = false
venvPath = "."
venv = ".venv"
