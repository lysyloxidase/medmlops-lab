stages:
  ingest:
    cmd: python -m medmlops.cli ingest
    deps:
      - src/medmlops/data/ingest.py
      - src/medmlops/cli.py
    outs:
      - data/raw/diabetes130.parquet
      - data/raw/diabetes130.sha256:
          cache: false
  validate:
    cmd: python -m medmlops.cli validate
    deps:
      - src/medmlops/data/contracts.py
      - src/medmlops/data/validate.py
      - src/medmlops/cli.py
      - data/raw/diabetes130.parquet
    outs:
      - data/interim/validated.parquet
    metrics:
      - reports/data_quality.json:
          cache: false
  preprocess:
    cmd: python -m medmlops.cli preprocess
    deps:
      - src/medmlops/features/pipeline.py
      - src/medmlops/data/ids_mapping.py
      - data/interim/validated.parquet
      - params.yaml
    outs:
      - data/processed/features.parquet
  split:
    cmd: python -m medmlops.cli split
    deps:
      - src/medmlops/features/pipeline.py
      - data/processed/features.parquet
      - params.yaml
    params:
      - data.validation_size
      - data.test_size
      - data.calibration_size
      - data.conformal_size
      - seed
    outs:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/calib.parquet
      - data/processed/conformal.parquet
      - data/processed/test.parquet
  train:
    cmd: python -m medmlops.cli train
    deps:
      - src/medmlops/features/pipeline.py
      - src/medmlops/models/baseline.py
      - src/medmlops/models/tabular_mlp.py
      - src/medmlops/models/tracking.py
      - src/medmlops/models/train.py
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/test.parquet
      - params.yaml
      - uv.lock
    params:
      - model
      - seed
    outs:
      - models/hero.pt
      - models/baseline.pkl
    metrics:
      - reports/train_metrics.json:
          cache: false
  calibrate:
    cmd: python -m medmlops.cli calibrate
    deps:
      - src/medmlops/calibration/calibrate.py
      - src/medmlops/models/tabular_mlp.py
      - src/medmlops/models/tracking.py
      - models/hero.pt
      - data/processed/calib.parquet
      - data/processed/val.parquet
      - params.yaml
    params:
      - calibration
    outs:
      - models/calibrated.pkl
    metrics:
      - reports/calibration_metrics.json:
          cache: false
    plots:
      - reports/figures/reliability.png
  conformalize:
    cmd: python -m medmlops.cli conformalize
    deps:
      - src/medmlops/conformal/conformal.py
      - src/medmlops/calibration/calibrate.py
      - src/medmlops/models/tracking.py
      - models/calibrated.pkl
      - data/processed/conformal.parquet
      - data/processed/test.parquet
      - params.yaml
    params:
      - conformal.alpha
    outs:
      - models/conformal.pkl
    metrics:
      - reports/conformal_metrics.json:
          cache: false
  evaluate:
    cmd: python -m medmlops.cli evaluate
    deps:
      - src/medmlops/metrics/clinical.py
      - src/medmlops/conformal/conformal.py
      - src/medmlops/calibration/calibrate.py
      - src/medmlops/models/tracking.py
      - models/conformal.pkl
      - data/processed/test.parquet
      - params.yaml
    metrics:
      - reports/clinical_metrics.json:
          cache: false
    plots:
      - reports/figures/decision_curve.png
  drift_baseline:
    cmd: python -m medmlops.cli drift-baseline
    deps:
      - src/medmlops/monitoring/
      - src/medmlops/features/pipeline.py
      - src/medmlops/cli.py
      - data/processed/train.parquet
      - params.yaml
    params:
      - features
      - monitoring.evidently_version_pin
    outs:
      - reports/drift/reference_snapshot.parquet
