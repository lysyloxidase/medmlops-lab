repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: nbstripout
        name: nbstripout
        entry: uv run nbstripout
        language: system
        types: [jupyter]
      - id: conventional-commit
        name: conventional-commit
        entry: uv run python -m medmlops.quality.commits
        language: system
        stages: [commit-msg]
      - id: pytest-unit
        name: pytest-unit
        entry: uv run pytest tests/unit --cov=medmlops --cov-fail-under=85
        language: system
        pass_filenames: false
        stages: [pre-push]
