services:
  app:
    image: medmlops:ci
    command:
      [
        "uvicorn",
        "medmlops.serving.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    environment:
      MEDMLOPS_ENV: ci
      MEDMLOPS_REGISTRY_REQUIRED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"

  postgres:
    ports: !reset []

  mlflow:
    ports: !reset []

  minio:
    ports: !reset []
